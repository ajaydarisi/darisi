<svg width="512" height="512" viewBox="-38.5 -30 572 572" xmlns="http://www.w3.org/2000/svg">
  <!--
    Golden Ratio "D" Favicon — Darisi (filled for small-size legibility)
    Glyph path is byte-identical to /logo.svg; only the frame differs.
    Glyph ink box is x 120..375, y 56..456 — the outer curve peaks at 375,
    not at its 460 control point — so the viewBox is offset to centre it in
    a 572 tile. Glyph height is 70% of the tile, corner radius is 22%.
  -->
  <rect x="-38.5" y="-30" width="572" height="572" rx="126" fill="#F6F2EA" />
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 120 56 L 120 456 C 460 456 460 56 120 56 Z M 192 120 L 192 392 C 400 392 400 120 192 120 Z"
    fill="#0F2724"
  />
  <circle cx="427" cy="416" r="40" fill="#914D30" />
</svg>
